<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0c2340" />
  <meta name="description" content="Holy Cross 9th Grade study app — lessons, flashcards, and interactive quizzes." />
  <meta name="color-scheme" content="light dark" />

  <!-- Add-to-Home-Screen on iPhone -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="HC Study" />

  <title>Holy Cross Study — 9th Grade</title>
  <link rel="stylesheet" href="assets/app.css" />
</head>
<body>
  <a class="skip-link" href="#view">Skip to content</a>

  <header class="topbar">
    <div class="topbar__inner">
      <div class="crest" aria-hidden="true">HC</div>
      <div class="topbar__titles">
        <div class="topbar__title" id="topbar-title">Physical Science</div>
        <div class="topbar__sub" id="topbar-sub">9th Grade</div>
      </div>
      <button class="icon-btn" id="theme-btn" type="button" aria-label="Change theme">◐</button>
    </div>
  </header>

  <main class="shell">
    <div id="view"></div>
  </main>

  <div class="actionbar" id="actionbar" hidden>
    <div class="actionbar__inner" id="actionbar-inner"></div>
  </div>

  <div class="backdrop" id="backdrop" hidden>
    <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title"></div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  <noscript>
    <p style="padding:24px;text-align:center">
      This study app needs JavaScript enabled.
    </p>
  </noscript>

  <script src="data/9th-grade/physical-science.js"></script>
  <script src="assets/app.js"></script>
</body>
</html>
